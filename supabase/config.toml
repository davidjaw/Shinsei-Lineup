# Hosted-project function settings only. This repo does not run a local
# Supabase stack (`supabase start`); db push uses the linked project.
#
# handbook-snapshot is a public CORS proxy. Gateway JWT verification would
# 401 the browser OPTIONS preflight (no Authorization header) and surface
# as a CORS error on GitHub Pages.

[functions.handbook-snapshot]
verify_jwt = false

# capture-ingest checks the user's bearer token itself (GET /auth/v1/user), so
# the CORS preflight is not 401'd by the gateway.
[functions.capture-ingest]
verify_jwt = false
