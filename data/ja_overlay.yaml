# Hand-kept Japanese for script/build_ja_overlay.py (→ .build/ja.json): what the official cfg does not give.
#   terms     zh-TW term → ja, for terms cfg has no row for (ours: tags, stat and damage names)
#   statuses  zh-TW status → {name, description}; the descriptions are ours (statuses.yaml), so their ja is too
#   skills    zh-TW skill name → {slots: {n: var name or literal}, name, description, commander_description}
#             `slots` settles the cfg text's numbered slots the script cannot line up by itself
#   traits    zh-TW trait name → {name, description, slots}
#   bingxue   JP key → {slots, description}

